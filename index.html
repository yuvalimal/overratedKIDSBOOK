<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>תחרות ספר הילדים הכי אוברייטד בישראל</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4757;
            --primary-hover: #ff6b81;
            --bg: #f1f2f6;
            --card-bg: #ffffff;
            --text: #2f3542;
        }
        
        body {
            font-family: 'Heebo', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        header {
            max-width: 800px;
            margin: 0 auto 40px auto;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            font-weight: 900;
        }

        p {
            font-size: 1.2rem;
            color: #57606f;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-top: 5px solid #dfe4ea;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border-top: 5px solid var(--primary);
        }

        .book-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin: 0 0 5px 0;
        }

        .book-author {
            color: #747d8c;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .vote-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            font-family: inherit;
        }

        .vote-btn:hover {
            background-color: var(--primary-hover);
        }

        .votes {
            font-size: 1.5rem;
            font-weight: 900;
            margin-top: 15px;
            color: var(--text);
        }

        /* מדליות למקומות הראשונים */
        .rank-1 { border-top-color: #ffd32a !important; }
        .rank-2 { border-top-color: #d2dae2 !important; }
        .rank-3 { border-top-color: #cd6133 !important; }

    </style>
</head>
<body>

    <header>
        <h1>פרס הבלון המנופח 🎈</h1>
        <p>תחרות ספרי הילדים הכי אוברייטד בישראל. הגיע הזמן להודות באמת - איזה קלאסיקה הכי עשתה לכם חור בראש?</p>
    </header>

    <div class="container">
        <div class="grid" id="booksGrid">
            </div>
    </div>

    <script>
        // רשימת הספרים
        let books = [
            { id: 1, title: "מעשה בחמישה בלונים", author: "מרים רות", votes: 0 },
            { id: 2, title: "תירס חם", author: "מרים רות", votes: 0 },
            { id: 3, title: "מיץ פטל", author: "חיה שנהב", votes: 0 },
            { id: 4, title: "דירה להשכיר", author: "לאה גולדברג", votes: 0 },
            { id: 5, title: "איה פלוטו", author: "לאה גולדברג", votes: 0 },
            { id: 6, title: "האריה שאהב תות", author: "תרצה אתר", votes: 0 },
            { id: 7, title: "אליעזר והגזר", author: "לוין קיפניס", votes: 0 },
            { id: 8, title: "ציפור הנפש", author: "מיכל סנונית", votes: 0 },
            { id: 9, title: "הבית של יעל", author: "מרים רות", votes: 0 },
            { id: 10, title: "איילת מטיילת", author: "רינת הופר", votes: 0 },
            { id: 11, title: "כובע קסמים", author: "לאה גולדברג", votes: 0 },
            { id: 12, title: "והילד הזה הוא אני", author: "יהודה אטלס", votes: 0 },
            { id: 13, title: "הכבש השישה עשר", author: "יהונתן גפן", votes: 0 },
            { id: 14, title: "הכינה נחמה", author: "מאיר שלו", votes: 0 },
            { id: 15, title: "אבא עושה בושות", author: "מאיר שלו", votes: 0 },
            { id: 16, title: "שמוליקיפוד", author: "כוש", votes: 0 },
            { id: 17, title: "דודי שמחה", author: "ע. הלל", votes: 0 },
            { id: 18, title: "אוזו ומוזו מכפר קקרוזו", author: "אפרים סידון", votes: 0 },
            { id: 19, title: "פילים בכל הצבעים", author: "יעקב שביט", votes: 0 },
            { id: 20, title: "גלגלים", author: "מיריק שניר", votes: 0 },
            { id: 21, title: "אין אריות כאלה", author: "אמי רובינגר", votes: 0 },
            { id: 22, title: "כספיון הדג הקטן", author: "פאול קור", votes: 0 },
            { id: 23, title: "גור חתול אדם ארוך שיער", author: "אתגר קרת", votes: 0 },
            { id: 24, title: "גומות החן של זוהר", author: "מאיר שלו", votes: 0 },
            { id: 25, title: "אורי", author: "אסתר שטרייט-וורצל", votes: 0 }
        ];

        // משיכת הצבעות מהזיכרון המקומי (כדי שלא יימחק ברענון הדף)
        const savedVotes = JSON.parse(localStorage.getItem('overratedBookVotes'));
        if (savedVotes) {
            books = savedVotes;
        }

        const grid = document.getElementById('booksGrid');

        // פונקציה לרינדור הספרים
        function renderBooks() {
            grid.innerHTML = '';
            
            // מיון הספרים לפי כמות ההצבעות (מהגבוה לנמוך)
            books.sort((a, b) => b.votes - a.votes);

            books.forEach((book, index) => {
                let rankClass = '';
                if (index === 0 && book.votes > 0) rankClass = 'rank-1';
                else if (index === 1 && book.votes > 0) rankClass = 'rank-2';
                else if (index === 2 && book.votes > 0) rankClass = 'rank-3';

                const card = document.createElement('div');
                card.className = `card ${rankClass}`;
                card.innerHTML = `
                    <div>
                        <h2 class="book-title">"${book.title}"</h2>
                        <div class="book-author">${book.author}</div>
                    </div>
                    <div>
                        <button class="vote-btn" onclick="vote(${book.id})">הכי אוברייטד! 👎</button>
                        <div class="votes">${book.votes} הצבעות</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // פונקציית הצבעה
        function vote(id) {
            const bookIndex = books.findIndex(b => b.id === id);
            if (bookIndex !== -1) {
                books[bookIndex].votes += 1;
                localStorage.setItem('overratedBookVotes', JSON.stringify(books));
                renderBooks();
            }
        }

        // הפעלה ראשונית
        renderBooks();
    </script>
</body>
</html>
